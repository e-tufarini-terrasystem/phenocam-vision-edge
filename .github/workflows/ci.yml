# Verify the deterministic Python and shell checks for every change to main.
# Reference images are versioned test fixtures; Raspberry Pi hardware remains external.

name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Python 3.13
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install runtime dependencies
        run: python -m pip install -r requirements/test.txt
      - name: Run tests (including reference images)
        run: python -m unittest discover -s tests -v
      - name: Run dataset tests (images not required)
        run: python -m unittest discover -s dataset/tests -v
      - name: Check shell syntax
        run: |
          sh -n scripts/batch.sh
          sh -n scripts/installer.sh
          for script in dataset/commands/*.sh; do sh -n "$script"; done
